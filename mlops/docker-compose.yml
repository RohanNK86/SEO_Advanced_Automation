version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: mlops/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - api_keys=${api_keys:-}
      - base_url=${base_url:-}
      - llm_model=${llm_model:-gpt-4o-mini}
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    volumes:
      - ../mlruns:/mlflow

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
    depends_on:
      - backend
